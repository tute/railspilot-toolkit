name: Script Tests

on:
  pull_request:
    paths:
      - ".claude/scripts/**"
      - ".claude/skills/jev-ac-check/check"
      - ".github/workflows/scripts-tests.yml"
      - "bin/test"

jobs:
  scripts-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run script tests
        run: bin/test scripts
